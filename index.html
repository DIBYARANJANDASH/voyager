<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voyager - Constellation Trace</title>

    <!-- Firebase SDK via Firebase Hosting Reserved URLs -->
    <script defer src="/__/firebase/13.1.0/firebase-app-compat.js" onerror="this.onerror=null;"></script>
    <script defer src="/__/firebase/13.1.0/firebase-auth-compat.js" onerror="this.onerror=null;"></script>
    <script defer src="/__/firebase/13.1.0/firebase-firestore-compat.js" onerror="this.onerror=null;"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true" onerror="this.onerror=null;"></script>

    <!-- Voyager Core Game Engine & Leaderboard -->
    <script defer src="game.js"></script>
    <script defer src="leaderboard.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #030712 100%);
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        width: 100%;
        max-width: 800px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="leaderboard-screen" style="display: none;"></div>
    </div>
  </body>
</html>
